<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Hindi Picture Dictionary</title>
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Rozha+One&family=Yantramanav:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --secondary: #f59e0b;
      --secondary-light: #fef3c7;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Yantramanav', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 16px 20px 12px;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    .app-title {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Search Bar */
    .search-box {
      margin-top: 12px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .search-box .material-symbols-rounded {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Category Chips */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 20px 6px;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-chip {
      padding: 8px 16px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .cat-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Word Grid */
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      padding: 16px 20px;
    }

    .word-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: transform 0.15s;
    }

    .word-card:active {
      transform: scale(0.97);
    }

    .card-img {
      width: 76px;
      height: 76px;
      border-radius: 14px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .card-en {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .card-hi {
      font-size: 15px;
      font-weight: 600;
      color: #ea580c;
      margin-top: 2px;
    }

    .card-hinglish {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .audio-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--primary-light);
      color: var(--primary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary);
    }

    /* Modal / Bottom Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      border-radius: 28px 28px 0 0;
      padding: 24px 20px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .detail-icon {
      font-size: 64px;
      text-align: center;
      margin: 10px 0;
    }

    .pill-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .example-box {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 0 12px 12px 0;
      margin-top: 14px;
      font-size: 14px;
    }

    /* Quiz & Flashcards Views */
    .view-container {
      display: none;
      padding: 20px;
    }
    .view-container.active {
      display: block;
    }

    .quiz-card {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      border: 1px solid var(--border);
      text-align: center;
      margin-top: 14px;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .quiz-opt-btn {
      padding: 14px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .quiz-opt-btn.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
    }

    .quiz-opt-btn.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="mainHeader">
    <div class="app-title">
      <span class="material-symbols-rounded" style="color:var(--primary); font-size:26px;">auto_stories</span>
      चित्र शब्दकोश (Picture Dictionary)
    </div>
    <div class="search-box">
      <span class="material-symbols-rounded">search</span>
      <input type="text" id="searchInput" placeholder="Search Hindi or English (उदा. Apple, सेब, Car)...">
    </div>
  </header>

  <!-- Categories Scroll -->
  <div class="category-scroll" id="catChips"></div>

  <!-- Main View (Dictionary) -->
  <div id="dictView" class="view-container active" style="padding:0;">
    <div class="word-grid" id="wordGrid"></div>
  </div>

  <!-- Quiz View -->
  <div id="quizView" class="view-container">
    <h2 style="font-size: 20px; font-weight:800;">🧠 खेल-खेल में सीखें (Quiz)</h2>
    <p style="color:var(--text-muted); font-size:14px; margin-top:4px;">सही चित्र या अर्थ पहचानें</p>
    
    <div class="quiz-card" id="quizContainer">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- Word Detail Bottom Sheet -->
  <div class="modal-overlay" id="detailModal" onclick="closeDetail(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="pill-badge" id="modalCat">Category</span>
        <button onclick="closeDetailDirect()" style="border:none; background:none; cursor:pointer;"><span class="material-symbols-rounded">close</span></button>
      </div>
      <div class="detail-icon" id="modalEmoji">🍎</div>
      <h2 style="font-size: 24px; font-weight:800; text-align:center;" id="modalEn">Apple</h2>
      <h3 style="font-size: 20px; color:#ea580c; text-align:center; font-weight:700; margin-top:4px;" id="modalHi">सेब</h3>
      <p style="text-align:center; color:var(--text-muted); font-size:14px;" id="modalPron">Aap-pul</p>

      <div style="display:flex; justify-content:center; gap:10px; margin: 16px 0;">
        <button class="cat-chip active" onclick="speakCurrent('en')" style="font-size:14px;">🔊 English बोलें</button>
        <button class="cat-chip" onclick="speakCurrent('hi')" style="font-size:14px; background:#ea580c; color:#fff; border-color:#ea580c;">🔊 हिन्दी बोलें</button>
      </div>

      <div class="example-box">
        <strong>English Example:</strong>
        <p id="modalExEn" style="margin-top:4px;">An apple a day keeps the doctor away.</p>
        <strong style="display:block; margin-top:8px; color:#ea580c;">हिन्दी अर्थ:</strong>
        <p id="modalExHi" style="margin-top:4px;">रोज़ एक सेब खाने से बीमारी दूर रहती है।</p>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('dict')">
      <span class="material-symbols-rounded">menu_book</span>
      डिक्शनरी
    </button>
    <button class="nav-item" onclick="switchTab('quiz')">
      <span class="material-symbols-rounded">quiz</span>
      प्रश्नोत्तरी (Quiz)
    </button>
  </nav>

      { id: 36, en: "Nose", hi: "नाक", hinglish: "Naak", pron: "Nohz", cat: "शरीर के अंग (Body Parts)", emoji: "👃", exEn: "We smell with our nose.", exHi: "हम अपनी नाक से सूंघते हैं।" },
      { id: 37, en: "Hand", hi: "हाथ", hinglish: "Haath", pron: "Hand", cat: "शरीर के अंग (Body Parts)", emoji: "✋", exEn: "Wash your hands before eating.", exHi: "खाना खाने से पहले हाथ धोएं।" },
      { id: 38, en: "Heart", hi: "दिल / हृदय", hinglish: "Dil", pron: "Hahrt", cat: "शरीर के अंग (Body Parts)", emoji: "❤️", exEn: "The heart pumps blood.", exHi: "दिल खून को पंप करता है।" },

      // Vehicles
      { id: 39, en: "Aeroplane", hi: "हवाई जहाज़", hinglish: "Hawai Jahaz", pron: "Air-oh-playn", cat: "वाहन (Vehicles)", emoji: "✈️", exEn: "The aeroplane flies in the sky.", exHi: "हवाई जहाज़ आसमान में उड़ता है।" },
      { id: 40, en: "Train", hi: "रेलगाड़ी", hinglish: "Railgadi", pron: "Trayn", cat: "वाहन (Vehicles)", emoji: "🚆", exEn: "The train runs on tracks.", exHi: "रेलगाड़ी पटरियों पर चलती है।" },
      { id: 41, en: "Car", hi: "गाड़ी / कार", hinglish: "Gaadi", pron: "Kahr", cat: "वाहन (Vehicles)", emoji: "🚗", exEn: "Drive the car carefully.", exHi: "कार सावधानी से चलाएं।" },
      { id: 42, en: "Bicycle", hi: "साइकिल", hinglish: "Cycle", pron: "By-sih-kul", cat: "वाहन (Vehicles)", emoji: "🚲", exEn: "Riding a bicycle is good exercise.", exHi: "साइकिल चलाना एक अच्छा व्यायाम है।" },

      // House & Daily
      { id: 43, en: "Book", hi: "किताब / पुस्तक", hinglish: "Kitaab", pron: "Book", cat: "घरेलू वस्तुएं (Home)", emoji: "📖", exEn: "Reading books gives knowledge.", exHi: "किताबें पढ़ने से ज्ञान मिलता है।" },
      { id: 44, en: "Clock", hi: "घड़ी", hinglish: "Ghadi", pron: "Klok", cat: "घरेलू वस्तुएं (Home)", emoji: "⏰", exEn: "The clock tells the time.", exHi: "घड़ी समय बताती है।" },
      { id: 45, en: "Water", hi: "पानी / जल", hinglish: "Paani", pron: "Wah-ter", cat: "दैनिक शब्द (Daily)", emoji: "💧", exEn: "Drink plenty of water.", exHi: "खूब सारा पानी पिएं।" },
      { id: 46, en: "Sun", hi: "सूरज / सूर्य", hinglish: "Sooraj", pron: "Sun", cat: "दैनिक शब्द (Daily)", emoji: "☀️", exEn: "The sun rises in the east.", exHi: "सूरज पूरब में उगता है।" },
      { id: 47, en: "Moon", hi: "चाँद / चंद्रमा", hinglish: "Chaand", pron: "Moon", cat: "दैनिक शब्द (Daily)", emoji: "🌙", exEn: "The moon shines at night.", exHi: "चाँद रात में चमकता है।" }
    ];

    let currentSelectedWord = null;
    let selectedCat = "सब (All)";

    // Init Categories
    function initCategories() {
      const categories = ["सब (All)", ...new Set(wordsData.map(w => w.cat))];
      const chipsCont = document.getElementById("catChips");
      chipsCont.innerHTML = categories.map((c, i) => `
        <div class="cat-chip ${i === 0 ? 'active' : ''}" onclick="filterCat('${c}', this)">${c}</div>
      `).join('');
    }

    // Render Words
    function renderWords(list) {
      const grid = document.getElementById("wordGrid");
      if(list.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted);">
          <span class="material-symbols-rounded" style="font-size:48px;">search_off</span>
          <p style="margin-top:10px;">कोई शब्द नहीं मिला (No word found)</p>
        </div>`;
        return;
      }
      grid.innerHTML = list.map(w => `
        <div class="word-card" onclick="openDetail(${w.id})">
          <button class="audio-btn" onclick="event.stopPropagation(); speakText('${w.en}')">
            <span class="material-symbols-rounded" style="font-size:18px;">volume_up</span>
          </button>
          <div class="card-img">${w.emoji}</div>
          <div class="card-en">${w.en}</div>
          <div class="card-hi">${w.hi}</div>
          <div class="card-hinglish">${w.hinglish}</div>
        </div>
      `).join('');
    }

    // Category Filter
    function filterCat(cat, elem) {
      selectedCat = cat;
      document.querySelectorAll(".cat-chip").forEach(el => el.classList.remove("active"));
      elem.classList.add("active");
      applyFilter();
    }

    // Search & Filter
    function applyFilter() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      let filtered = wordsData;

      if (selectedCat !== "सब (All)") {
        filtered = filtered.filter(w => w.cat === selectedCat);
      }

      if (query) {
        filtered = filtered.filter(w => 
          w.en.toLowerCase().includes(query) || 
          w.hi.includes(query) || 
          w.hinglish.toLowerCase().includes(query)
        );
      }

      renderWords(filtered);
    }

    document.getElementById("searchInput").addEventListener("input", applyFilter);

    // Text To Speech
    function speakText(text, lang = 'en-US') {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("आवाज़ की सुविधा इस ब्राउज़र में उपलब्ध नहीं है।");
      }
    }

    // Open Detail Modal
    function openDetail(id) {
      currentSelectedWord = wordsData.find(w => w.id === id);
      if (!currentSelectedWord) return;

      document.getElementById("modalCat").innerText = currentSelectedWord.cat;
      document.getElementById("modalEmoji").innerText = currentSelectedWord.emoji;
      document.getElementById("modalEn").innerText = currentSelectedWord.en;
      document.getElementById("modalHi").innerText = currentSelectedWord.hi;
      document.getElementById("modalPron").innerText = `उच्चारण: ${currentSelectedWord.pron} (${currentSelectedWord.hinglish})`;
      document.getElementById("modalExEn").innerText = currentSelectedWord.exEn;
      document.getElementById("modalExHi").innerText = currentSelectedWord.exHi;

      document.getElementById("detailModal").style.display = "flex";
      speakText(currentSelectedWord.en);
    }

    function closeDetail(e) {
      if (e.target.id === "detailModal") {
        document.getElementById("detailModal").style.display = "none";
      }
    }
    function closeDetailDirect() {
      document.getElementById("detailModal").style.display = "none";
    }

    function speakCurrent(type) {
      if (!currentSelectedWord) return;
      if (type === 'en') speakText(currentSelectedWord.en, 'en-US');
      if (type === 'hi') speakText(currentSelectedWord.hi, 'hi-IN');
    }

    // Tabs Switching
    function switchTab(tab) {
      document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".view-container").forEach(el => el.classList.remove("active"));

      if (tab === 'dict') {
        document.querySelector(".nav-item:nth-child(1)").classList.add("active");
        document.getElementById("dictView").classList.add("active");
        document.getElementById("mainHeader").style.display = "block";
        document.getElementById("catChips").style.display = "flex";
      } else {
        document.querySelector(".nav-item:nth-child(2)").classList.add("active");
        document.getElementById("quizView").classList.add("active");
        document.getElementById("mainHeader").style.display = "none";
        document.getElementById("catChips").style.display = "none";
        loadNewQuiz();
      }
    }

    // Quiz Logic
    function loadNewQuiz() {
      const randomWord = wordsData[Math.floor(Math.random() * wordsData.length)];
      let options = [randomWord];
      while (options.length < 4) {
        let opt = wordsData[Math.floor(Math.random() * wordsData.length)];
        if (!options.some(o => o.id === opt.id)) options.push(opt);
      }
      options.sort(() => Math.random() - 0.5);

      const cont = document.getElementById("quizContainer");
      cont.innerHTML = `
        <div style="font-size: 72px;">${randomWord.emoji}</div>
        <h3 style="font-size: 22px; margin-top:10px;">"${randomWord.en}" का सही अर्थ क्या है?</h3>
        <button onclick="speakText('${randomWord.en}')" class="cat-chip" style="margin:10px auto; display:inline-flex;">🔊 आवाज़ सुनें</button>
        <div class="quiz-options">
          ${options.map(o => `
            <button class="quiz-opt-btn" onclick="checkAnswer(this, ${o.id === randomWord.id})">${o.hi} (${o.hinglish})</button>
          `).join('')}
        </div>
      `;
    }

    function checkAnswer(btn, isCorrect) {
      if (isCorrect) {
        btn.classList.add("correct");
        speakText("शाबाश! बिल्कुल सही।", 'hi-IN');
        setTimeout(loadNewQuiz, 1400);
      } else {
        btn.classList.add("wrong");
        speakText("गलत जवाब, फिर से प्रयास करें।", 'hi-IN');
      }
    }

    // Start App
    initCategories();
    renderWords(wordsData);
  </script>
</body>
</html>
